<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anthony Rendon's Personal Wishlist</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      :root {
        --bg: #0b1020;
        --panel: rgba(15, 23, 42, 0.72);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text: #e5eefc;
        --muted: #9fb0d0;
        --accent: #8b5cf6;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(139, 92, 246, 0.35), transparent 30%),
          radial-gradient(circle at top right, rgba(34, 197, 94, 0.18), transparent 25%),
          linear-gradient(180deg, #060816 0%, #0b1020 100%);
      }

      .app-shell {
        max-width: 920px;
        margin: 0 auto;
        display: grid;
        gap: 20px;
      }

      .hero,
      .panel {
        backdrop-filter: blur(18px);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .hero {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding: 28px;
        align-items: center;
      }

      .hero-copy {
        flex: 1;
      }

      .hero-image-wrap {
        flex: 0 0 auto;
      }

      .hero-image {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.25);
      }

      .eyebrow {
        margin: 0 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--muted);
        font-size: 12px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1;
        margin-bottom: 10px;
      }

      .subtitle {
        max-width: 560px;
        color: var(--muted);
        line-height: 1.6;
      }

      .hero-card,
      .panel {
        padding: 22px;
      }

      .hero-card {
        min-width: 180px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .hero-label {
        display: inline-block;
        margin-bottom: 10px;
        color: #c7d2fe;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
      }

      #countdown {
        font-size: 1rem;
        color: var(--text);
      }

      .panel-header {
        margin-bottom: 18px;
      }

      .panel-header p {
        color: var(--muted);
        margin-top: 6px;
      }

      .wishlist-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 14px;
      }

      .wishlist-link {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 16px;
        align-items: center;
        text-decoration: none;
        color: var(--text);
        padding: 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: transform 0.18s ease, border-color 0.18s ease;
      }

      .wishlist-link:hover {
        transform: translateY(-2px);
        border-color: rgba(139, 92, 246, 0.5);
      }

      .wishlist-image {
        width: 110px;
        height: 110px;
        object-fit: cover;
        border-radius: 14px;
        display: block;
      }

      .wishlist-meta {
        display: grid;
        gap: 6px;
      }

      .wishlist-name {
        font-size: 1.05rem;
        font-weight: 700;
      }

      .wishlist-caption {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .empty-state {
        padding: 26px 18px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed rgba(255, 255, 255, 0.12);
        border-radius: 18px;
      }

      @media (max-width: 700px) {
        body {
          padding: 14px;
        }

        .app-shell {
          max-width: 100%;
          gap: 14px;
        }

        .hero,
        .panel {
          border-radius: 18px;
        }

        .hero {
          flex-direction: column;
          align-items: flex-start;
          padding: 20px;
        }

        .hero-copy {
          width: 100%;
        }

        h1 {
          font-size: clamp(1.8rem, 10vw, 2.6rem);
        }

        .subtitle {
          max-width: 100%;
          font-size: 0.98rem;
        }

        .hero-card {
          width: 100%;
          min-width: 0;
          padding: 18px;
        }

        .panel {
          padding: 18px;
        }

        .hero-image {
          width: 100%;
          max-width: 220px;
          height: 220px;
        }

        .wishlist-link {
          grid-template-columns: 1fr;
        }

        .wishlist-image {
          width: 100%;
          height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div class="hero-copy">
          <h1>Anthony Rendon's Wishlist</h1>
          <p class="subtitle">can i get this plz</p>
        </div>

        <div class="hero-image-wrap">
          <img
            class="hero-image"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPjva3qIcG4yseaWFivJCVPAQECPpb_Jh5eaaJ0kNzR9VeEU_d1qf7lQU&s=10"
            alt="Wishlist image"
          />
        </div>

        <div class="hero-card">
          <span class="hero-label">Birthday Countdown</span>
          <p id="countdown"></p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Your wishlist</h2>
          <p>Manage items directly in the code.</p>
        </div>

        <ul id="wishlistItems" class="wishlist-list"></ul>
      </section>
    </main>

    <script>
      const list = document.getElementById("wishlistItems");
      const countdownEl = document.getElementById("countdown");

      let items = [
        {
          name: "Apple Airpods 4 with Active Noise Cancellation",
          image: "https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcStQniTwqiEs-M-0b0WpdrbrGSrnUCKpeU3qLQ_UKwoKVo7TJlBp_w0ottyP-AO7jv7ctr_BcHs7qdUHz7LdRR2M8jq_aNNUWKNs1Vt0EgRGLaoHBDQbvdCUGBLraEP6q0NigRe3M3sTdw&usqp=CAc",
          link: "https://www.bestbuy.com/product/apple-airpods-4-with-active-noise-cancellation-white/JJGCQ832YX/sku/6447385?utm_source=feed&extStoreId=1168&ref=212&loc=21698362010&gclsrc=aw.ds&gad_source=4&gad_campaignid=21702195532&gbraid=0AAAAAD-ORIiWZ_2foqix_V0lhFUxsa2b-&gclid=CjwKCAjwmozTBhAeEiwAkEGZzhpdz5CK39QW6vWvRVpXOJUz6-pP_6d6KaTGvkAdOid5Lw5KEjEF3RoCZqwQAvD_BwE"
        },
      ];

      function updateCountdown() {
        const now = new Date();
        let birthday = new Date(now.getFullYear(), 7, 10);

        if (now > birthday) {
          birthday = new Date(now.getFullYear() + 1, 7, 10);
        }

        const diff = birthday - now;
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        countdownEl.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
      }

      function renderWishlist() {
        list.innerHTML = "";

        if (items.length === 0) {
          list.innerHTML = '<li class="empty-state">No wishlist items yet. Add them directly in the code.</li>';
          return;
        }

        items.forEach((item) => {
          const li = document.createElement("li");
          li.className = "wishlist-item";
          li.innerHTML = `
            <a class="wishlist-link" href="${item.link}" target="_blank" rel="noopener noreferrer">
              <img class="wishlist-image" src="${item.image}" alt="${item.name}" />
              <div class="wishlist-meta">
                <span class="wishlist-name">${item.name}</span>
                <span class="wishlist-caption">Click for link</span>
              </div>
            </a>
          `;
          list.appendChild(li);
        });
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
      renderWishlist();
    </script>
  </body>
</html>
