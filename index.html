<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <title>Anthony Rendon's Personal Wishlist</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
      :root {
        --bg: #0b1020;
        --panel: rgba(15, 23, 42, 0.72);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text: #e5eefc;
        --muted: #9fb0d0;
        --accent: #8b5cf6;
        --accent-hover: #7c3aed;
        --bought: #ef4444;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: max(32px, env(safe-area-inset-top)) max(32px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(32px, env(safe-area-inset-left));
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(139, 92, 246, 0.35), transparent 30%),
          radial-gradient(circle at top right, rgba(34, 197, 94, 0.18), transparent 25%),
          linear-gradient(180deg, #060816 0%, #0b1020 100%);
        background-attachment: fixed;
      }

      .app-shell {
        max-width: 920px;
        margin: 0 auto;
        display: grid;
        gap: 20px;
      }

      .hero,
      .panel {
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .hero {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        padding: 28px;
      }

      .hero-copy {
        flex: 1;
      }

      .hero-image-wrap {
        flex: 0 0 auto;
      }

      .hero-image {
        width: 110px;
        height: 110px;
        object-fit: cover;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.25);
      }

      h1, h2, h3, p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.1;
        margin-bottom: 8px;
      }

      .subtitle {
        max-width: 560px;
        color: var(--muted);
        line-height: 1.5;
      }

      .hero-card,
      .panel {
        padding: 22px;
      }

      .hero-card {
        min-width: 180px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .hero-label {
        display: inline-block;
        margin-bottom: 8px;
        color: #c7d2fe;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
      }

      #countdown {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text);
      }

      .panel-header {
        margin-bottom: 18px;
      }

      .panel-header p {
        color: var(--muted);
        margin-top: 4px;
      }

      .wishlist-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 14px;
      }

      .wishlist-item {
        display: grid;
        grid-template-columns: 100px 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 12px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: transform 0.18s ease, border-color 0.18s ease;
      }

      .wishlist-item:hover {
        transform: translateY(-2px);
        border-color: rgba(139, 92, 246, 0.5);
      }

      .wishlist-item.is-bought {
        opacity: 0.6;
      }

      .wishlist-image {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 14px;
        display: block;
      }

      .wishlist-meta {
        display: grid;
        gap: 6px;
      }

      .wishlist-name {
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--text);
        text-decoration: none;
      }

      .wishlist-name:hover {
        text-decoration: underline;
      }

      .wishlist-item.is-bought .wishlist-name {
        text-decoration: line-through;
      }

      .wishlist-caption {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .bought-badge {
        color: var(--bought);
        font-weight: 700;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .buy-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 10px 16px;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.1s ease;
      }

      .buy-btn:hover {
        background: var(--accent-hover);
        transform: scale(1.02);
      }

      .empty-state {
        padding: 26px 18px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed rgba(255, 255, 255, 0.12);
        border-radius: 18px;
      }

      /* Pop-up Overlay Styling */
      .popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .popup-card {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        padding: 24px;
        border-radius: 20px;
        max-width: 320px;
        width: 90%;
        text-align: center;
        box-shadow: var(--shadow);
      }

      .popup-img {
        width: 100%;
        max-height: 250px;
        object-fit: cover;
        border-radius: 14px;
        margin-bottom: 14px;
      }

      .popup-card h3 {
        margin-bottom: 8px;
        font-size: 1.25rem;
      }

      .popup-card p {
        color: var(--muted);
