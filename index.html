<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <title>Anthony Rendon's Personal Wishlist</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
      :root {
        --bg: #0b1020;
        --panel: rgba(15, 23, 42, 0.72);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text: #e5eefc;
        --muted: #9fb0d0;
        --accent: #8b5cf6;
        --accent-hover: #7c3aed;
        --bought: #ef4444;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: max(32px, env(safe-area-inset-top)) max(32px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(32px, env(safe-area-inset-left));
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(139, 92, 246, 0.35), transparent 30%),
          radial-gradient(circle at top right, rgba(34, 197, 94, 0.18), transparent 25%),
          linear-gradient(180deg, #060816 0%, #0b1020 100%);
        background-attachment: fixed;
      }

      .app-shell {
        max-width: 920px;
        margin: 0 auto;
        display: grid;
        gap: 20px;
      }

      .hero,
      .panel {
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .hero {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        padding: 28px;
      }

      .hero-copy {
        flex: 1;
      }

      .hero-image-wrap {
        flex: 0 0 auto;
      }

      .hero-image {
        width: 110px;
        height: 110px;
        object-fit: cover;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.25);
      }

      h1, h2, p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.1;
        margin-bottom: 8px;
      }

      .subtitle {
        max-width: 560px;
        color: var(--muted);
        line-height: 1.5;
      }

      .hero-card,
      .panel {
        padding: 22px;
      }

      .hero-card {
        min-width: 180px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .hero-label {
        display: inline-block;
        margin-bottom: 8px;
        color: #c7d2fe;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
      }

      #countdown {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text);
      }

      .panel-header {
        margin-bottom: 18px;
      }

      .panel-header p {
        color: var(--muted);
        margin-top: 4px;
      }

      .wishlist-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 14px;
      }

      .wishlist-item {
        display: grid;
        grid-template-columns: 100px 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 12px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: transform 0.18s ease, border-color 0.18s ease;
      }

      .wishlist-item:hover {
        transform: translateY(-2px);
        border-color: rgba(139, 92, 246, 0.5);
      }

      .wishlist-item.is-bought {
        opacity: 0.6;
      }

      .wishlist-image {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 14px;
        display: block;
      }

      .wishlist-meta {
        display: grid;
        gap: 6px;
      }

      .wishlist-name {
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--text);
        text-decoration: none;
      }

      .wishlist-name:hover {
        text-decoration: underline;
      }

      .wishlist-item.is-bought .wishlist-name {
        text-decoration: line-through;
      }

      .wishlist-caption {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .bought-badge {
        color: var(--bought);
        font-weight: 700;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .buy-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 10px 16px;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.1s ease;
      }

      .buy-btn:hover {
        background: var(--accent-hover);
        transform: scale(1.02);
      }

      .empty-state {
        padding: 26px 18px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed rgba(255, 255, 255, 0.12);
        border-radius: 18px;
      }

      @media (max-width: 700px) {
        body {
          padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }

        .app-shell {
          gap: 14px;
        }

        .hero,
        .panel {
          border-radius: 20px;
          padding: 18px;
        }

        .hero {
          flex-direction: column;
          align-items: flex-start;
          gap: 16px;
        }

        .hero-image-wrap {
          width: 100%;
          display: flex;
          justify-content: flex-start;
        }

        .hero-image {
          width: 80px;
          height: 80px;
          border-radius: 14px;
        }

        .hero-card {
          width: 100%;
          padding: 14px 16px;
        }

        .wishlist-item {
          grid-template-columns: 70px 1fr;
          gap: 12px;
        }

        .wishlist-image {
          width: 70px;
          height: 70px;
        }

        .buy-action {
          grid-column: span 2;
          width: 100%;
        }

        .buy-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div class="hero-copy">
          <h1>Anthony Rendon's Wishlist</h1>
          <p class="subtitle">plz let me get this.</p>
        </div>

        <div class="hero-image-wrap">
          <img
            class="hero-image"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPjva3qIcG4yseaWFivJCVPAQECPpb_Jh5eaaJ0kNzR9VeEU_d1qf7lQU&s=10"
            alt="Wishlist image"
          />
        </div>

        <div class="hero-card">
          <span class="hero-label">Birthday Countdown</span>
          <p id="countdown"></p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Items</h2>
        </div>

        <ul id="wishlistItems" class="wishlist-list"></ul>
      </section>
    </main>

    <script>
      // Firebase Config
      const firebaseConfig = {
        apiKey: "AIzaSyBFCmFYwg-GGyOtxbFOXRfbTgwmsgcCL6E",
        authDomain: "anthony-wishlist.firebaseapp.com",
        projectId: "anthony-wishlist",
        storageBucket: "anthony-wishlist.firebasestorage.app",
        messagingSenderId: "132375706695",
        appId: "1:132375706695:web:dec43dfcc144fcaa504562"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      const list = document.getElementById("wishlistItems");
      const countdownEl = document.getElementById("countdown");

      function updateCountdown() {
        const now = new Date();
        let birthday = new Date(now.getFullYear(), 7, 10);

        if (now > birthday) {
          birthday = new Date(now.getFullYear() + 1, 7, 10);
        }

        const diff = birthday - now;
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        countdownEl.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
      }

      // Mark an item as bought in Firestore
      async function handlePurchase(docId, itemName) {
        const confirmPurchase = confirm(`Are you sure you want to mark "${itemName}" as bought?`);
        if (!confirmPurchase) return;

        try {
          await db.collection("wishlist").doc(docId).update({
            isBought: true
          });
        } catch (error) {
          console.error("Error updating item status:", error);
          alert("Something went wrong. Please try again.");
        }
      }

      // Real-time listener for database changes
      function listenToWishlist() {
        db.collection("wishlist").onSnapshot((snapshot) => {
          list.innerHTML = "";

          if (snapshot.empty) {
            list.innerHTML = '<li class="empty-state">No wishlist items found.</li>';
            return;
          }

          snapshot.forEach((doc) => {
            const item = doc.data();
            const docId = doc.id;

            const li = document.createElement("li");
            li.className = `wishlist-item ${item.isBought ? "is-bought" : ""}`;

            li.innerHTML = `
              <img class="wishlist-image" src="${item.image || ''}" alt="${item.name}" />
              <div class="wishlist-meta">
                <a class="wishlist-name" href="${item.link}" target="_blank" rel="noopener noreferrer">${item.name}</a>
                <span class="wishlist-caption">${item.isBought ? "Purchased" : "Click title for link"}</span>
              </div>
              <div class="buy-action">
                ${
                  item.isBought
                    ? '<span class="bought-badge">✓ Bought</span>'
                    : `<button class="buy-btn" onclick="handlePurchase('${docId}', '${item.name.replace(/'/g, "\\'")}')">Mark as Bought</button>`
                }
              </div>
            `;
            list.appendChild(li);
          });
        });
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
      listenToWishlist();
    </script>
  </body>
</html>
